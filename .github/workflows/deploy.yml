name: Build & Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you trigger manually from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install dependencies (clean Linux environment — no Windows binary issues)
      - name: Install dependencies
        run: npm install

      # 4. Build the Vite project
      - name: Build
        run: npm run build

      # 5. Copy product images into dist/images
      #    (Images/ folder is committed to the repo alongside src/)
      - name: Copy product images
        run: |
          mkdir -p dist/images
          cp -r Images/* dist/images/ 2>/dev/null || true

      # 6. Deploy to Firebase Hosting
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gen-lang-client-0686783756
          target: preprigs
          channelId: live
